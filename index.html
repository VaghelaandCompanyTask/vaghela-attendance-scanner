<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#00a6a6">

  <title>
    Vaghela & Company - Attendance
  </title>


  <!-- QR SCANNER LIBRARY -->

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 18px;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f6fbfb 100%
        );

      color: #111111;

    }


    .container {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

    }


    /* ====================================
       BRAND
       ==================================== */

    .brand {

      text-align: center;

      padding-top: 8px;

      margin-bottom: 20px;

    }


    .brand-name {

      font-size: 27px;

      font-weight: 700;

      letter-spacing: -0.5px;

    }


    .brand-name span {

      color: #00a6a6;

    }


    .tagline {

      margin-top: 5px;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 2px;

      color: #555555;

    }


    /* ====================================
       MEETING CARD
       ==================================== */

    .meeting-card {

      background: #ffffff;

      border:
        1px solid #eeeeee;

      border-radius: 16px;

      padding: 17px;

      margin-bottom: 15px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.05);

      text-align: center;

    }


    .meeting-label {

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1.2px;

      color: #00a6a6;

      text-transform: uppercase;

      margin-bottom: 6px;

    }


    #meetingTopic {

      font-size: 19px;

      font-weight: 700;

      line-height: 1.3;

      margin-bottom: 6px;

    }


    #meetingDate {

      font-size: 13px;

      color: #666666;

    }


    /* ====================================
       SCANNER CARD
       ==================================== */

    .scanner-card {

      background: #ffffff;

      border:
        1px solid #eeeeee;

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.07);

    }


    .scanner-title {

      font-size: 20px;

      font-weight: 700;

      text-align: center;

      margin-bottom: 5px;

    }


    .scanner-subtitle {

      font-size: 13px;

      color: #777777;

      text-align: center;

      margin-bottom: 17px;

    }


    /* ====================================
       QR SCANNER
       ==================================== */

    #reader {

      width: 100%;

      border:
        none !important;

      border-radius: 14px;

      overflow: hidden;

      background: #f5f5f5;

    }


    #reader video {

      border-radius: 14px;

    }


    #reader__dashboard {

      padding: 10px !important;

    }


    #reader__dashboard_section_csr {

      display: none !important;

    }


    #reader button {

      border: none;

      border-radius: 8px;

      background: #00a6a6;

      color: #ffffff;

      padding:
        9px 15px;

      font-weight: 600;

      cursor: pointer;

    }


    #reader select {

      max-width: 100%;

      padding: 8px;

      border-radius: 8px;

      border:
        1px solid #cccccc;

    }


    /* ====================================
       STATUS
       ==================================== */

    .status-box {

      display: none;

      margin-top: 17px;

      padding: 17px;

      border-radius: 12px;

      text-align: center;

    }


    .status-icon {

      font-size: 32px;

      margin-bottom: 7px;

    }


    .status-title {

      font-size: 19px;

      font-weight: 700;

      margin-bottom: 6px;

    }


    .status-message {

      font-size: 13px;

      line-height: 1.5;

    }


    /* SUCCESS */

    .status-success {

      display: block;

      background: #eaf9f5;

      border:
        1px solid #c8eee4;

      color: #08745d;

    }


    /* DUPLICATE */

    .status-duplicate {

      display: block;

      background: #fff8e8;

      border:
        1px solid #f0dfad;

      color: #765900;

    }


    /* INVALID */

    .status-invalid {

      display: block;

      background: #fff1f1;

      border:
        1px solid #ffd2d2;

      color: #b42318;

    }


    /* ERROR */

    .status-error {

      display: block;

      background: #fff1f1;

      border:
        1px solid #ffd2d2;

      color: #b42318;

    }


    /* ====================================
       SCAN NEXT
       ==================================== */

    #scanNextButton {

      display: none;

      width: 100%;

      height: 48px;

      margin-top: 13px;

      border: none;

      border-radius: 9px;

      background: #00a6a6;

      color: #ffffff;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    #scanNextButton:hover {

      opacity: 0.92;

    }


    /* ====================================
       FOOTER
       ==================================== */

    .footer {

      text-align: center;

      margin-top: 18px;

      color: #888888;

      font-size: 11px;

      line-height: 1.5;

    }


    /* ====================================
       LOADING
       ==================================== */

    .loading {

      text-align: center;

      color: #777777;

      font-size: 13px;

      padding: 12px;

    }


    @media (max-width: 420px) {

      body {
        padding: 13px;
      }

      .brand-name {
        font-size: 25px;
      }

      .scanner-card {
        padding: 14px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ==================================
       BRAND
       ================================== -->

  <div class="brand">

    <div class="brand-name">
      Vaghela <span>&amp;</span> Company
    </div>

    <div class="tagline">
      PLAN • INVEST • GROW
    </div>

  </div>


  <!-- ==================================
       MEETING
       ================================== -->

  <div class="meeting-card">

    <div class="meeting-label">
      Attendance
    </div>


    <div id="meetingTopic">
      Loading meeting...
    </div>


    <div id="meetingDate">
      Please wait...
    </div>

  </div>


  <!-- ==================================
       SCANNER
       ================================== -->

  <div class="scanner-card">


    <div class="scanner-title">
      Scan Client QR
    </div>


    <div class="scanner-subtitle">
      Point the camera at the client's QR code
    </div>


    <div id="reader"></div>


    <div
      id="statusBox"
      class="status-box">


      <div
        id="statusIcon"
        class="status-icon">
      </div>


      <div
        id="statusTitle"
        class="status-title">
      </div>


      <div
        id="statusMessage"
        class="status-message">
      </div>

    </div>


    <button
      id="scanNextButton"
      onclick="scanNext()">

      Scan Next Client

    </button>


  </div>


  <div class="footer">

    Vaghela &amp; Company Financial Services

    <br>

    Client Meeting Attendance

  </div>


</div>



<script>


/* ==========================================
   APPS SCRIPT BACKEND
   ========================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwpbh3s-hyOGkppRp1HnfCSw-rIcSraL4OXoOngDeLMSm52k2Jp0m8nmRoLM-9K3ZWAiA/exec";


/* ==========================================
   SCANNER VARIABLES
   ========================================== */

let html5QrCode = null;

let isProcessing = false;


/* ==========================================
   LOAD CURRENT MEETING
   ========================================== */

function loadMeeting() {

  const callbackName =
    "vaghelaMeetingResult_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        console.log(
          "Meeting API response:",
          response
        );


        /*
         * Actual Apps Script response:
         *
         * {
         *   success: true,
         *   meetingId: "M004",
         *   topic: "Financial Freedom",
         *   date: "01 October 2026"
         * }
         */

        if (
          response &&
          response.success === true
        ) {

          document.getElementById(
            "meetingTopic"
          ).textContent =
            response.topic ||
            "Client Meeting";


          document.getElementById(
            "meetingDate"
          ).textContent =
            response.date
              ? "Date: " +
                response.date
              : "";

        } else {

          document.getElementById(
            "meetingTopic"
          ).textContent =
            "Meeting information unavailable";


          document.getElementById(
            "meetingDate"
          ).textContent =
            "";

        }

      } catch (error) {

        console.error(
          "Meeting display error:",
          error
        );

        document.getElementById(
          "meetingTopic"
        ).textContent =
          "Meeting information unavailable";

      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?api=meeting" +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      document.getElementById(
        "meetingTopic"
      ).textContent =
        "Unable to load meeting";


      document.getElementById(
        "meetingDate"
      ).textContent =
        "";

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


/* ==========================================
   QR SCANNER SUCCESS
   ========================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (isProcessing) {

    return;

  }


  isProcessing = true;


  stopScanner();


  verifyAttendance(
    decodedText
  );

}


/* ==========================================
   VERIFY ATTENDANCE
   ========================================== */

function verifyAttendance(
  qrToken
) {

  const callbackName =
    "vaghelaAttendanceResult_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        console.log(
          "Attendance API response:",
          response
        );


        /* ==================================
           NO RESPONSE
           ================================== */

        if (!response) {

          showStatus(
            "error",
            "Something Went Wrong",
            "No response was received from the attendance system."
          );

          return;

        }


        /*
         * ACTUAL APPS SCRIPT RESPONSE FORMAT
         *
         * Example:
         *
         * {
         *   success: true,
         *   status: "DUPLICATE",
         *   message: "Already Checked In",
         *   registrationId: "M004-002",
         *   meetingId: "M004",
         *   name: "pppppppppp",
         *   checkInTime: "..."
         * }
         *
         * Therefore we use:
         *
         * response.status
         * response.name
         *
         * NOT:
         *
         * response.type
         * response.clientName
         */


        /* ==================================
           DUPLICATE
           ================================== */

        if (
          response.status === "DUPLICATE"
        ) {

          showStatus(
            "duplicate",
            "Already Checked In",
            (response.name || "Client") +
            "<br><br>" +
            "Registration ID: " +
            (response.registrationId || "-") +
            "<br><br>" +
            "This client has already been marked present."
          );

          return;

        }


        /* ==================================
           INVALID
           ================================== */

        if (
          response.status === "INVALID"
        ) {

          showStatus(
            "invalid",
            "Invalid QR Code",
            response.message ||
            "This QR code is not valid."
          );

          return;

        }


        /* ==================================
           SUCCESSFUL CHECK-IN
           ==================================

           Apps Script uses:

           success: true

           for a successful check-in.

           We therefore don't require a
           separate "type" field.
        */

        if (
          response.success === true
        ) {

          showStatus(
            "success",
            "Attendance Confirmed",
            (response.name || "Client") +
            "<br><br>" +
            "Registration ID: " +
            (response.registrationId || "-") +
            "<br>" +
            "Check-in Time: " +
            formatCheckInTime(
              response.checkInTime
            )
          );

          return;

        }


        /* ==================================
           BACKEND ERROR
           ================================== */

        showStatus(
          "error",
          "Unable to Verify",
          response.message ||
          "Please try scanning the QR code again."
        );


      } catch (error) {

        console.error(
          "Attendance response error:",
          error
        );


        showStatus(
          "error",
          "Unable to Verify",
          "Please try scanning the QR code again."
        );

      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?api=checkin" +
    "&token=" +
    encodeURIComponent(
      qrToken
    ) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      showStatus(
        "error",
        "Connection Error",
        "Unable to connect to the attendance system. Please try again."
      );


      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


/* ==========================================
   FORMAT CHECK-IN TIME
   ========================================== */

function formatCheckInTime(
  value
) {

  if (!value) {

    return "Just now";

  }


  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return value;

    }


    return date.toLocaleString(
      "en-IN",
      {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  } catch (error) {

    return value;

  }

}


/* ==========================================
   SHOW STATUS
   ========================================== */

function showStatus(
  type,
  title,
  message
) {

  const box =
    document.getElementById(
      "statusBox"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const titleElement =
    document.getElementById(
      "statusTitle"
    );


  const messageElement =
    document.getElementById(
      "statusMessage"
    );


  box.className =
    "status-box status-" +
    type;


  if (
    type === "success" ||
    type === "duplicate"
  ) {

    icon.textContent =
      "✓";

  } else {

    icon.textContent =
      "!";

  }


  titleElement.textContent =
    title;


  messageElement.innerHTML =
    message;


  box.style.display =
    "block";


  document.getElementById(
    "scanNextButton"
  ).style.display =
    "block";

}


/* ==========================================
   START SCANNER
   ========================================== */

function startScanner() {

  isProcessing = false;


  document.getElementById(
    "statusBox"
  ).style.display =
    "none";


  document.getElementById(
    "scanNextButton"
  ).style.display =
    "none";


  /*
   * If an old scanner instance exists,
   * don't create another one.
   */

  if (html5QrCode) {

    try {

      html5QrCode.clear();

    } catch (error) {

      console.log(
        "Scanner clear:",
        error
      );

    }

  }


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        // Ignore continuous scanner errors.

      }

    )

    .catch(
      function(error) {

        showStatus(
          "error",
          "Camera Could Not Start",
          "Please allow camera permission and reload this page."
        );


        console.error(
          error
        );

      }
    );

}


/* ==========================================
   STOP SCANNER
   ========================================== */

function stopScanner() {

  if (
    html5QrCode
  ) {

    html5QrCode
      .stop()

      .then(
        function() {

          try {

            html5QrCode.clear();

          } catch (error) {

            console.log(
              "Scanner clear:",
              error
            );

          }

        }
      )

      .catch(
        function(error) {

          console.log(
            "Scanner stop:",
            error
          );

        }
      );

  }

}


/* ==========================================
   SCAN NEXT CLIENT
   ========================================== */

function scanNext() {

  document.getElementById(
    "statusBox"
  ).style.display =
    "none";


  document.getElementById(
    "scanNextButton"
  ).style.display =
    "none";


  startScanner();

}


/* ==========================================
   PAGE LOAD
   ========================================== */

window.addEventListener(
  "load",
  function() {

    loadMeeting();

    startScanner();

  }
);


</script>

</body>

</html>
