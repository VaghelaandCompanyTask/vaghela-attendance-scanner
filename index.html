<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwpbh3s-hyOGkppRp1HnfCSw-rIcSraL4OXoOngDeLMSm52k2Jp0m8nmRoLM-9K3ZWAiA/exec";


/*
 * Maximum number of automatic attempts.
 */

const MAX_RETRIES = 3;


/*
 * Maximum time allowed for one API request.
 *
 * 8 seconds gives Google Apps Script enough
 * time while preventing an endless wait.
 */

const REQUEST_TIMEOUT = 8000;


/*
 * Delay between automatic attempts.
 */

const RETRY_DELAY = 700;


/* =========================================================
   SCANNER VARIABLES
   ========================================================= */

let html5QrCode = null;

let isProcessing = false;

let currentQrToken = null;

let currentAction = null;

let meetingLoaded = false;


/* =========================================================
   GENERIC DELAY
   ========================================================= */

function delay(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =========================================================
   JSONP REQUEST
   ========================================================= */

/*
 * This function creates a temporary JSONP callback.
 *
 * It also has a timeout.
 *
 * If Google Apps Script doesn't respond,
 * the Promise rejects and the retry system
 * can make another attempt.
 */

function jsonpRequest(
  url
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "vaghelaCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      let finished = false;

      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "Request timed out"
              )
            );

          },
          REQUEST_TIMEOUT
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              "Network error"
            )
          );

        };


      script.src =
        url +
        (
          url.indexOf("?") >= 0
            ? "&"
            : "?"
        ) +
        "callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&_=" +
        Date.now();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   JSONP WITH RETRY
   ========================================================= */

async function jsonpWithRetry(
  baseUrl,
  attempts,
  progressCallback
) {

  let lastError = null;


  for (
    let attempt = 1;
    attempt <= attempts;
    attempt++
  ) {

    try {

      if (
        progressCallback
      ) {

        progressCallback(
          attempt
        );

      }


      const response =
        await jsonpRequest(
          baseUrl
        );


      return response;

    } catch (error) {

      lastError =
        error;


      console.warn(
        "API attempt " +
        attempt +
        " failed:",
        error
      );


      if (
        attempt < attempts
      ) {

        await delay(
          RETRY_DELAY
        );

      }

    }

  }


  throw lastError ||
    new Error(
      "Request failed"
    );

}


/* =========================================================
   LOAD CURRENT MEETING
   ========================================================= */

async function loadMeeting() {

  const topicElement =
    document.getElementById(
      "meetingTopic"
    );


  const dateElement =
    document.getElementById(
      "meetingDate"
    );


  topicElement.className =
    "meeting-loading";


  topicElement.textContent =
    "Loading meeting...";


  dateElement.className =
    "meeting-loading";


  dateElement.textContent =
    "Connecting...";


  const url =
    APPS_SCRIPT_URL +
    "?api=meeting";


  try {

    const response =
      await jsonpWithRetry(
        url,
        MAX_RETRIES,
        function(attempt) {

          if (
            attempt > 1
          ) {

            topicElement.textContent =
              "Connecting to meeting...";


            dateElement.textContent =
              "Retry " +
              attempt +
              " of " +
              MAX_RETRIES;

          }

        }
      );


    console.log(
      "Meeting response:",
      response
    );


    if (
      response &&
      response.success === true
    ) {

      meetingLoaded =
        true;


      topicElement.className =
        "";


      topicElement.textContent =
        response.topic ||
        "Client Meeting";


      dateElement.className =
        "";


      dateElement.textContent =
        response.date
          ? "Date: " +
            response.date
          : "";

      return;

    }


    throw new Error(
      "Invalid meeting response"
    );


  } catch (error) {

    console.error(
      "Meeting loading failed:",
      error
    );


    meetingLoaded =
      false;


    topicElement.className =
      "meeting-error";


    topicElement.textContent =
      "Meeting information unavailable";


    dateElement.className =
      "meeting-error";


    dateElement.textContent =
      "Please try again";

  }

}


/* =========================================================
   QR SCAN SUCCESS
   ========================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  /*
   * Ignore another QR while the current
   * attendance request is running.
   */

  if (
    isProcessing
  ) {

    return;

  }


  /*
   * Ignore empty scans.
   */

  if (
    !decodedText ||
    !String(decodedText).trim()
  ) {

    return;

  }


  isProcessing =
    true;


  currentQrToken =
    String(decodedText).trim();


  currentAction =
    "attendance";


  /*
   * IMMEDIATELY show processing.
   */

  showProcessing(
    1
  );


  /*
   * Stop scanning while processing.
   */

  stopScanner();


  /*
   * Small delay allows the browser
   * to render the spinner before
   * the network request begins.
   */

  setTimeout(
    function() {

      verifyAttendance(
        currentQrToken
      );

    },
    80
  );

}


/* =========================================================
   SHOW PROCESSING
   ========================================================= */

function showProcessing(
  attempt
) {

  const box =
    document.getElementById(
      "statusBox"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const title =
    document.getElementById(
      "statusTitle"
    );


  const message =
    document.getElementById(
      "statusMessage"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  const scanNextButton =
    document.getElementById(
      "scanNextButton"
    );


  box.className =
    "status-box status-processing";


  icon.innerHTML =
    '<div class="spinner"></div>';


  title.textContent =
    "Processing Attendance";


  if (
    attempt &&
    attempt > 1
  ) {

    message.innerHTML =
      "QR code detected. Retrying connection...<div class=\"retry-text\">" +
      "Attempt " +
      attempt +
      " of " +
      MAX_RETRIES +
      "</div>";

  } else {

    message.innerHTML =
      "QR code detected. Verifying client attendance...";

  }


  box.style.display =
    "block";


  retryButton.style.display =
    "none";


  scanNextButton.style.display =
    "none";

}


/* =========================================================
   VERIFY ATTENDANCE
   ========================================================= */

async function verifyAttendance(
  qrToken
) {

  const url =
    APPS_SCRIPT_URL +
    "?api=checkin" +
    "&token=" +
    encodeURIComponent(
      qrToken
    );


  try {

    const response =
      await jsonpWithRetry(
        url,
        MAX_RETRIES,
        function(attempt) {

          showProcessing(
            attempt
          );

        }
      );


    console.log(
      "Attendance response:",
      response
    );


    /*
     * DUPLICATE
     */

    if (
      response &&
      response.status === "DUPLICATE"
    ) {

      showStatus(
        "duplicate",
        "Already Checked In",
        (response.name || "Client") +
        "<br><br>" +
        "Registration ID: " +
        (response.registrationId || "-") +
        "<br><br>" +
        "This client has already been marked present."
      );


      finishProcessing();

      return;

    }


    /*
     * INVALID
     */

    if (
      response &&
      response.status === "INVALID"
    ) {

      showStatus(
        "invalid",
        "Invalid QR Code",
        response.message ||
        "This QR code is not valid."
      );


      finishProcessing();

      return;

    }


    /*
     * SUCCESS
     */

    if (
      response &&
      response.success === true
    ) {

      showStatus(
        "success",
        "Attendance Confirmed",
        (response.name || "Client") +
        "<br><br>" +
        "Registration ID: " +
        (response.registrationId || "-") +
        "<br>" +
        "Check-in Time: " +
        formatCheckInTime(
          response.checkInTime
        )
      );


      finishProcessing();

      return;

    }


    /*
     * UNKNOWN RESPONSE
     */

    showStatus(
      "error",
      "Unable to Verify",
      response &&
      response.message
        ? response.message
        : "The attendance system returned an unexpected response."
    );


    finishProcessing();


  } catch (error) {

    console.error(
      "Attendance request failed:",
      error
    );


    /*
     * All automatic retries failed.
     *
     * Now show a useful error and
     * allow the employee to retry.
     */

    showConnectionError();

    finishProcessing();

  }

}


/* =========================================================
   CONNECTION ERROR
   ========================================================= */

function showConnectionError() {

  const box =
    document.getElementById(
      "statusBox"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const title =
    document.getElementById(
      "statusTitle"
    );


  const message =
    document.getElementById(
      "statusMessage"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  const scanNextButton =
    document.getElementById(
      "scanNextButton"
    );


  box.className =
    "status-box status-error";


  icon.textContent =
    "!";


  title.textContent =
    "Connection Problem";


  message.innerHTML =
    "The attendance server did not respond after multiple attempts." +
    "<br><br>" +
    "Your attendance has NOT been confirmed. Please try again.";


  box.style.display =
    "block";


  retryButton.style.display =
    "block";


  scanNextButton.style.display =
    "none";

}


/* =========================================================
   FINALIZE PROCESSING
   ========================================================= */

function finishProcessing() {

  isProcessing =
    false;

}


/* =========================================================
   SHOW STATUS
   ========================================================= */

function showStatus(
  type,
  title,
  message
) {

  const box =
    document.getElementById(
      "statusBox"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const titleElement =
    document.getElementById(
      "statusTitle"
    );


  const messageElement =
    document.getElementById(
      "statusMessage"
    );


  const scanNextButton =
    document.getElementById(
      "scanNextButton"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  box.className =
    "status-box status-" +
    type;


  if (
    type === "success" ||
    type === "duplicate"
  ) {

    icon.textContent =
      "✓";

  } else {

    icon.textContent =
      "!";

  }


  titleElement.textContent =
    title;


  messageElement.innerHTML =
    message;


  box.style.display =
    "block";


  retryButton.style.display =
    "none";


  scanNextButton.style.display =
    "block";

}


/* =========================================================
   FORMAT CHECK-IN TIME
   ========================================================= */

function formatCheckInTime(
  value
) {

  if (!value) {

    return "Just now";

  }


  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return value;

    }


    return date.toLocaleString(
      "en-IN",
      {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  } catch (error) {

    return value;

  }

}


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner() {

  /*
   * Make sure the scanner is unlocked.
   */

  isProcessing =
    false;


  /*
   * Hide old status.
   */

  document.getElementById(
    "statusBox"
  ).style.display =
    "none";


  document.getElementById(
    "scanNextButton"
  ).style.display =
    "none";


  document.getElementById(
    "retryButton"
  ).style.display =
    "none";


  /*
   * Create new scanner instance.
   */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        /*
         * Ignore normal continuous
         * QR scanning messages.
         */

      }

    )

    .catch(
      function(error) {

        console.error(
          "Camera start error:",
          error
        );


        showStatus(
          "error",
          "Camera Could Not Start",
          "Please allow camera permission and reload this page."
        );

      }
    );

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

  if (
    !html5QrCode
  ) {

    return;

  }


  try {

    html5QrCode
      .stop()

      .then(
        function() {

          try {

            html5QrCode.clear();

          } catch (error) {

            console.log(
              "Scanner clear:",
              error
            );

          }

        }
      )

      .catch(
        function(error) {

          console.log(
            "Scanner stop:",
            error
          );

        }
      );

  } catch (error) {

    console.log(
      "Scanner stop error:",
      error
    );

  }

}


/* =========================================================
   SCAN NEXT CLIENT
   ========================================================= */

function scanNext() {

  currentQrToken =
    null;


  currentAction =
    null;


  document.getElementById(
    "statusBox"
  ).style.display =
    "none";


  document.getElementById(
    "scanNextButton"
  ).style.display =
    "none";


  document.getElementById(
    "retryButton"
  ).style.display =
    "none";


  startScanner();

}


/* =========================================================
   RETRY CURRENT ACTION
   ========================================================= */

function retryCurrentAction() {

  /*
   * If we still have the QR token,
   * retry the attendance verification
   * without asking the employee to
   * scan the QR again.
   */

  if (
    currentQrToken &&
    currentAction === "attendance"
  ) {

    isProcessing =
      true;


    showProcessing(
      1
    );


    setTimeout(
      function() {

        verifyAttendance(
          currentQrToken
        );

      },
      80
    );


    return;

  }


  /*
   * Otherwise simply restart scanner.
   */

  scanNext();

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
     * IMPORTANT:
     *
     * Both operations start at the same time.
     *
     * Meeting loading does NOT block
     * camera startup.
     */

    loadMeeting();

    startScanner();

  }
);


</script>

</body>

</html>
